name: uni-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bot
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "uni-bot"
          git config user.email "uni-bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state"
          git push